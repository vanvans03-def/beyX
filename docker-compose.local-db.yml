# Overlay for the existing docker-compose.yml.
# Usage:
# docker compose --env-file .env --env-file .env.local-db \
#   -f docker-compose.yml -f docker-compose.local-db.yml up -d postgres

services:
  beyx:
    environment:
      DATABASE_URL: postgresql://beyx_app:${LOCAL_POSTGRES_APP_PASSWORD:?LOCAL_POSTGRES_APP_PASSWORD must be set}@postgres:5432/${LOCAL_POSTGRES_DB:-beyx}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET must be set}
      DATA_BACKEND: ${DATA_BACKEND:-supabase}
      AUTH_BACKEND: ${AUTH_BACKEND:-supabase}
      REALTIME_BACKEND: ${REALTIME_BACKEND:-supabase}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.80
    pids_limit: 256

  redis:
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    cpus: 0.15
    pids_limit: 64

  postgres:
    image: postgres:17.11-alpine
    container_name: beyx-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-beyx}
      POSTGRES_USER: ${LOCAL_POSTGRES_ADMIN_USER:-beyx_admin}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:?LOCAL_POSTGRES_ADMIN_PASSWORD must be set}
      LOCAL_POSTGRES_APP_PASSWORD: ${LOCAL_POSTGRES_APP_PASSWORD:?LOCAL_POSTGRES_APP_PASSWORD must be set}
      LOCAL_POSTGRES_BACKUP_PASSWORD: ${LOCAL_POSTGRES_BACKUP_PASSWORD:?LOCAL_POSTGRES_BACKUP_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - statement_timeout=30s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_compression=on
    ports:
      - 127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${LOCAL_POSTGRES_BACKUP_DIR:-./backups}:/backups
    shm_size: 128mb
    mem_limit: 512m
    cpus: 0.65
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
