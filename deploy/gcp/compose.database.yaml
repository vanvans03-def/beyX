name: beyx-gcp-data

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:?Set LOCAL_POSTGRES_DB}
      POSTGRES_USER: ${LOCAL_POSTGRES_ADMIN_USER:?Set LOCAL_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:?Set LOCAL_POSTGRES_ADMIN_PASSWORD}
      LOCAL_POSTGRES_APP_PASSWORD: ${LOCAL_POSTGRES_APP_PASSWORD:?Set LOCAL_POSTGRES_APP_PASSWORD}
      LOCAL_POSTGRES_BACKUP_PASSWORD: ${LOCAL_POSTGRES_BACKUP_PASSWORD:?Set LOCAL_POSTGRES_BACKUP_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - statement_timeout=30s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_compression=on
    ports:
      - ${VM_PRIVATE_IP:?Set VM_PRIVATE_IP}:5432:5432
    volumes:
      # PostgreSQL 18 uses a version-specific PGDATA beneath this mount.
      - postgres_data:/var/lib/postgresql
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../backups:/backups
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    ports:
      - ${VM_PRIVATE_IP:?Set VM_PRIVATE_IP}:6379:6379
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  postgres_data:
